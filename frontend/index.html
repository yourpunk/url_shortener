<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 6px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-item {
            margin-bottom: 15px;
        }

        .result-label {
            font-weight: 600;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .result-value {
            background: white;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 14px;
        }

        .copy-btn {
            background: none;
            border: 1px solid #667eea;
            color: #667eea;
            padding: 6px 12px;
            width: auto;
            margin-top: 8px;
            font-size: 12px;
        }

        .copy-btn:hover {
            background: #f0f0f0;
        }

        .error {
            color: #e74c3c;
            margin-top: 20px;
            padding: 15px;
            background: #fadad1;
            border-radius: 6px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 URL Shortener</h1>
        <p class="subtitle">Shorten your long URLs instantly</p>

        <form id="urlForm">
            <div class="form-group">
                <label for="urlInput">Enter URL to shorten:</label>
                <input 
                    type="url" 
                    id="urlInput" 
                    placeholder="https://example.com/long/path"
                    required
                >
            </div>
            <button type="submit">Shorten URL</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            Shortening...
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="result-item">
                <div class="result-label">Short URL</div>
                <div class="result-value" id="shortUrlValue"></div>
                <button class="copy-btn" onclick="copyToClipboard('shortUrlValue')">Copy</button>
            </div>
            <div class="result-item">
                <div class="result-label">Original URL</div>
                <div class="result-value" id="originalUrlValue"></div>
            </div>
            <div class="result-item">
                <div class="result-label">Short Code</div>
                <div class="result-value" id="shortCodeValue"></div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('urlForm');
        const urlInput = document.getElementById('urlInput');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const result = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = urlInput.value.trim();
            if (!url) return;

            loading.classList.add('show');
            error.classList.remove('show');
            result.classList.remove('show');

            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: url }),
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'Failed to shorten URL');
                }

                const data = await response.json();
                
                document.getElementById('shortUrlValue').textContent = data.short_url;
                document.getElementById('originalUrlValue').textContent = data.original_url;
                document.getElementById('shortCodeValue').textContent = data.short_code;
                
                result.classList.add('show');
                urlInput.value = '';
            } catch (err) {
                error.textContent = 'Error: ' + err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
            }
        });

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }
    </script>
</body>
</html>
